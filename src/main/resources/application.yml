spring:
  application:
    name: service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ccut?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20        # 最大连接数
      minimum-idle: 5              # 最小空闲连接数
      connection-timeout: 30000    # 获取连接超时时间（30秒）

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  ai:
    dashscope:
      api-key: sk-b79bfc6284eb467da714a7957eee7605
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

server:
  port: 9999

  # === 内嵌 Tomcat 优化 ===
  tomcat:
    threads:
      max: 100         # 最大处理线程数
      min-spare: 10    # 最小空闲线程数
    accept-count: 50   # 请求排队上限
    connection-timeout: 20000  # 连接超时时间20秒

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# === 日志系统（使用 logback-spring.xml） ===
logging:
  config: classpath:logback-spring.xml
  level:
    com.ccut.mapper: debug   # 打印SQL语句

file:
  # windows
  upload-dir: C:/Users/lenovo/Desktop/12/college-course-agent/uploads
