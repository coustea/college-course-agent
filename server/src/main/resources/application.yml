spring:
  application:
    name: service

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 5

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ccut?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 30        # 最大连接数
      minimum-idle: 10             # 最小空闲连接数
      connection-timeout: 30000    # 获取连接超时时间（30秒）
      idle-timeout: 600000         # 空闲连接超时（10分钟）
      max-lifetime: 1800000        # 连接最大生命周期（30分钟）
      leak-detection-threshold: 60000  # 连接泄漏检测（1分钟）

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  ai:
    dashscope:
      api-key: sk-414fa005f52f41acb70c615dd2f7cc95

server:
  port: 9999

  # === 内嵌 Tomcat 优化 ===
  tomcat:
    threads:
      max: 100         # 最大处理线程数
      min-spare: 10    # 最小空闲线程数
    accept-count: 50   # 请求排队上限
    connection-timeout: 20000  # 连接超时时间20秒

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true


logging:
  level:
    com.ccut.mapper: debug   # 打印SQL语句

file:
  # windows
#  upload-dir: C:/Users/lenovo/Desktop/12/college-course-agent/uploads
#   ubuntu
  upload-dir: /home/couseta/develop/CCUT/backend

# JWT认证开关（开发环境设为false，生产环境设为true）
jwt:
  enabled: false
